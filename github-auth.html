<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GitHub Login | ADEZ TECH PRO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0f12;
      color: #e8edf5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #14253a;
      border-radius: 22px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    .github {
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: #0e1827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .brand {
      color: #2860ef;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9ba8ba;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .account-box {
      background: #101d2d;
      border: 1px solid #263a53;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 22px;
    }

    .account-box strong {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .account-box span {
      color: #8d9bad;
      font-size: 11px;
    }

    .github-btn {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 11px;
      background: #f1f3f5;
      color: #101828;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .github-btn:hover {
      background: #ffffff;
    }

    .github-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .cancel {
      display: block;
      margin-top: 20px;
      color: #7e8da1;
      font-size: 13px;
      text-decoration: none;
    }

    .cancel:hover {
      color: #2860ef;
    }

    .security {
      margin-top: 25px;
      color: #69798d;
      font-size: 10px;
      line-height: 1.6;
    }

    .error {
      display: none;
      background: #3a171b;
      color: #ffb4b4;
      padding: 12px;
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="github">
      ●
    </div>

    <div class="brand">
      ADEZ TECH PRO
    </div>

    <h1>Continue with GitHub</h1>

    <p class="subtitle">
      Sign in securely using your GitHub account
      to continue to your dashboard.
    </p>

    <div
      id="error"
      class="error"
    ></div>

    <div class="account-box">
      <strong>GitHub Authentication</strong>
      <span>
        You will be redirected to GitHub to authorize
        your account securely.
      </span>
    </div>

    <button
      class="github-btn"
      id="githubButton"
      onclick="loginWithGithub()"
    >
      <span>●</span>
      Continue with GitHub
    </button>

    <a
      href="/login.html"
      class="cancel"
    >
      ← Back to Login
    </a>

    <div class="security">
      🔒 Your GitHub password is never entered into
      ADEZ TECH PRO.
    </div>

  </div>


  <script>

    function loginWithGithub() {

      const button =
        document.getElementById("githubButton");

      button.disabled = true;

      button.textContent =
        "Connecting to GitHub...";

      /*
       * OAuth must be handled by your server.
       * Never put the GitHub Client Secret here.
       */

      window.location.href =
        "/auth/github";

    }


    /*
     * Display an OAuth error returned by the server.
     *
     * Example:
     * /github-auth.html?error=access_denied
     */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const error =
      params.get("error");


    if (error) {

      const errorBox =
        document.getElementById("error");

      errorBox.style.display =
        "block";

      errorBox.textContent =
        "GitHub authentication failed: " +
        error;

    }

  </script>

</body>
</html>
