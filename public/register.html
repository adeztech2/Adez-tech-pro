<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <title>Create Account | ADEZ TECH</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top right, #073d58 0, transparent 35%),
        radial-gradient(circle at bottom left, #171044 0, transparent 35%),
        #070b16;
    }

    .auth-box {
      width: 100%;
      max-width: 460px;
      padding: 38px;
      background: #0d1424;
      border: 1px solid #1c2a43;
      border-radius: 18px;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo a {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .auth-logo span {
      color: #00d9ff;
    }

    .auth-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-heading h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    .auth-heading p {
      color: #8996ac;
      font-size: 14px;
    }

    .auth-form label {
      display: block;
      margin: 16px 0 7px;
      color: #d6deeb;
      font-size: 14px;
    }

    .auth-form input {
      width: 100%;
      padding: 14px;
      background: #070d19;
      color: #fff;
      border: 1px solid #263650;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    .auth-form input:focus {
      border-color: #00d9ff;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 60px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #00d9ff;
      cursor: pointer;
      padding: 6px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 18px;
      color: #8996ac;
      font-size: 12px;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .terms a {
      color: #00d9ff;
    }

    .create-btn {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #00d9ff;
      color: #041018;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .create-btn:hover {
      background: #5eeaff;
    }

    .message {
      display: none;
      padding: 11px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #32171d;
      border: 1px solid #71313c;
      color: #ff8491;
    }

    .message.success {
      display: block;
      background: #102d27;
      border: 1px solid #205d50;
      color: #67e8c9;
    }

    .auth-footer {
      text-align: center;
      margin-top: 23px;
      color: #8996ac;
      font-size: 14px;
    }

    .auth-footer a {
      color: #00d9ff;
      font-weight: bold;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #7f8ca3;
      font-size: 13px;
    }

    .back-home:hover {
      color: #00d9ff;
    }

    @media (max-width: 500px) {
      .auth-box {
        padding: 27px 21px;
      }
    }
  </style>
</head>

<body class="auth-page">

  <div class="auth-box">

    <div class="auth-logo">
      <a href="index.html">
        ADEZ<span>TECH</span>
      </a>
    </div>

    <div class="auth-heading">
      <h1>Create Account</h1>
      <p>Join ADEZ TECH and get started today.</p>
    </div>

    <form id="registerForm" class="auth-form">

      <label for="name">Full Name</label>
      <input
        id="name"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        minlength="2"
        required
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        id="phone"
        type="tel"
        placeholder="e.g. 0712345678"
        autocomplete="tel"
        required
      >

      <label for="password">Password</label>

      <div class="password-wrap">
        <input
          id="password"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('password', this)">
          Show
        </button>
      </div>

      <label for="confirmPassword">Confirm Password</label>

      <div class="password-wrap">
        <input
          id="confirmPassword"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('confirmPassword', this)">
          Show
        </button>
      </div>

      <div class="terms">
        <input id="terms" type="checkbox" required>

        <label for="terms">
          I agree to the ADEZ TECH terms and understand that
          this demo authentication stores account data locally.
        </label>
      </div>

      <div id="registerMessage" class="message"></div>

      <button type="submit" class="create-btn">
        Create Account
      </button>

    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

  </div>

<script>
  const registerForm =
    document.getElementById("registerForm");

  const registerMessage =
    document.getElementById("registerMessage");


  function showMessage(message, type) {

    registerMessage.textContent = message;

    registerMessage.className =
      "message " + type;
  }


  function togglePassword(id, button) {

    const input =
      document.getElementById(id);

    if (input.type === "password") {
      input.type = "text";
      button.textContent = "Hide";
    } else {
      input.type = "password";
      button.textContent = "Show";
    }
  }


  registerForm.addEventListener("submit", function(e) {

    e.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim().toLowerCase();

    const phone =
      document.getElementById("phone").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const terms =
      document.getElementById("terms").checked;


    if (name.length < 2) {
      showMessage(
        "Please enter your full name.",
        "error"
      );
      return;
    }


    if (!email.includes("@")) {
      showMessage(
        "Please enter a valid email address.",
        "error"
      );
      return;
    }


    if (phone.length < 8) {
      showMessage(
        "Please enter a valid phone number.",
        "error"
      );
      return;
    }


    if (password.length < 6) {
      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );
      return;
    }


    if (password !== confirmPassword) {
      showMessage(
        "Passwords do not match.",
        "error"
      );
      return;
    }


    if (!terms) {
      showMessage(
        "Please accept the terms to continue.",
        "error"
      );
      return;
    }


    const existingUser =
      JSON.parse(
        localStorage.getItem("adezUser") || "null"
      );


    if (
      existingUser &&
      existingUser.email &&
      existingUser.email.toLowerCase() === email
    ) {
      showMessage(
        "An account with this email already exists. Please login.",
        "error"
      );
      return;
    }


    const user = {
      name: name,
      email: email,
      phone: phone,
      password: password
    };


    localStorage.setItem(
      "adezUser",
      JSON.stringify(user)
    );


    showMessage(
      "Account created successfully. Opening your dashboard...",
      "success"
    );


    setTimeout(function() {
      window.location.href = "dashboard.html";
    }, 900);

  });
</script>

</body>
</html>
