<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | ADEZ TECH PRO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0f12;
      color: #e8edf5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .register-card {
      width: 100%;
      max-width: 635px;
      background: #14253a;
      border-radius: 23px;
      padding: 28px 23px 38px;
      box-shadow: 0 15px 45px rgba(0,0,0,.35);
    }

    /* LOGO */

    .logo-area {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 16px;
      border-radius: 22px;
      background: #101b2c;
      border: 1px solid #1e2c43;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 25px rgba(30, 90, 255, .12);
    }

    .logo-inner {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #20d9ff;
      font-size: 25px;
      font-weight: bold;
      border: 2px solid #273b59;
    }

    .brand-line {
      color: #2860ef;
      font-size: 16px;
      font-weight: 600;
      margin-top: 4px;
    }

    /* TITLE */

    h1 {
      text-align: center;
      font-size: 31px;
      margin-top: 25px;
      margin-bottom: 8px;
      letter-spacing: -.5px;
    }

    .subtitle {
      text-align: center;
      color: #9ba8ba;
      font-size: 18px;
      margin-bottom: 35px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 21px;
    }

    label {
      display: block;
      color: #9ba8ba;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .8px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      height: 61px;
      border: 0;
      outline: none;
      border-radius: 11px;
      padding: 0 17px;
      background: #111d2b;
      color: white;
      font-size: 17px;
    }

    input::placeholder {
      color: #8794a6;
    }

    input:focus {
      box-shadow: 0 0 0 2px #2456ed;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .eye {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #8390a3;
      font-size: 21px;
      user-select: none;
    }

    /* TERMS */

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 5px 2px 25px;
      color: #929eaf;
      font-size: 12px;
      line-height: 1.5;
    }

    .terms input {
      width: 17px;
      height: 17px;
      margin-top: 1px;
      accent-color: #2457ed;
    }

    .terms a {
      color: #2860ef;
      text-decoration: none;
    }

    /* BUTTON */

    .signup-btn {
      width: 100%;
      height: 62px;
      border: 0;
      border-radius: 13px;
      background: #2455eb;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(37, 85, 235, .3);
      transition: .2s;
    }

    .signup-btn:hover {
      background: #1d48d2;
    }

    .signup-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* LOGIN */

    .login-line {
      text-align: center;
      margin-top: 25px;
      color: #98a4b5;
      font-size: 15px;
    }

    .login-line a {
      color: #2860ef;
      font-weight: 700;
      text-decoration: none;
      margin-left: 5px;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 30px 0 25px;
      color: #8793a4;
      font-size: 15px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #29394d;
    }

    /* SOCIAL */

    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .social-btn {
      height: 54px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #d9e0ea;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-icon {
      font-weight: 900;
      font-size: 21px;
      color: #4285f4;
    }

    .github-icon {
      font-size: 21px;
    }

    /* MESSAGE */

    .message {
      display: none;
      padding: 13px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .message.error {
      display: block;
      background: #3a171b;
      color: #ffb4b4;
    }

    .message.success {
      display: block;
      background: #123528;
      color: #8ee8bd;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      body {
        padding: 15px;
        align-items: center;
      }

      .register-card {
        padding: 25px 22px 30px;
        border-radius: 21px;
      }

      h1 {
        font-size: 29px;
      }

      .subtitle {
        font-size: 16px;
      }

      input {
        height: 59px;
      }

      .signup-btn {
        height: 61px;
      }

      .social-buttons {
        gap: 5px;
      }

      .social-btn {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="register-card">

    <!-- LOGO -->
    <div class="logo-area">

      <div class="logo">
        <div class="logo-inner">
          ⌂
        </div>
      </div>

      <div class="brand-line">
        Bots . Boosting . VPS
      </div>

    </div>


    <!-- TITLE -->

    <h1>Create Account</h1>

    <p class="subtitle">
      Create your account to get started
    </p>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- FORM -->

    <form id="registerForm">

      <div class="form-group">

        <label for="username">
          USERNAME
        </label>

        <input
          id="username"
          name="username"
          type="text"
          placeholder="Choose a username"
          autocomplete="username"
          minlength="3"
          maxlength="30"
          required
        >

      </div>


      <div class="form-group">

        <label for="email">
          EMAIL
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          PASSWORD
        </label>

        <div class="password-wrap">

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <span
            class="eye"
            onclick="togglePassword('password', this)"
          >
            ◉
          </span>

        </div>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          CONFIRM PASSWORD
        </label>

        <div class="password-wrap">

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <span
            class="eye"
            onclick="togglePassword('confirmPassword', this)"
          >
            ◉
          </span>

        </div>

      </div>


      <!-- TERMS -->

      <div class="terms">

        <input
          id="terms"
          type="checkbox"
          required
        >

        <div>
          I agree to the
          <a href="/terms.html">
            Terms of Service
          </a>
          and
          <a href="/privacy.html">
            Privacy Policy
          </a>.
        </div>

      </div>


      <!-- REGISTER -->

      <button
        type="submit"
        class="signup-btn"
        id="signupButton"
      >
        SIGN UP
      </button>

    </form>


    <!-- LOGIN -->

    <div class="login-line">

      Already have an account?

      <a href="/login.html">
        Log In
      </a>

    </div>


    <!-- DIVIDER -->

    <div class="divider">
      or continue with
    </div>


    <!-- SOCIAL LOGIN -->

    <div class="social-buttons">

      <button
        class="social-btn"
        onclick="googleLogin()"
      >

        <span class="google-icon">
          G
        </span>

        Google

      </button>


      <button
        class="social-btn"
        onclick="githubLogin()"
      >

        <span class="github-icon">
          ◉
        </span>

        GitHub

      </button>

    </div>

  </div>


<script>

  function togglePassword(id, element) {

    const input =
      document.getElementById(id);

    if (input.type === "password") {

      input.type = "text";
      element.textContent = "◉";

    } else {

      input.type = "password";
      element.textContent = "◉";

    }

  }


  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

  }


  document
    .getElementById("registerForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const username =
          document
            .getElementById("username")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        const terms =
          document
            .getElementById("terms")
            .checked;


        const button =
          document
            .getElementById("signupButton");


        if (username.length < 3) {

          showMessage(
            "Username must be at least 3 characters.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        if (!terms) {

          showMessage(
            "Please accept the Terms of Service and Privacy Policy.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "CREATING ACCOUNT...";


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  username,
                  email,
                  password
                })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.success
          ) {

            showMessage(
              data.message ||
              "Registration failed.",
              "error"
            );

            button.disabled = false;

            button.textContent =
              "SIGN UP";

            return;
          }


          showMessage(
            "Account created successfully. Redirecting...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "/dashboard.html";

            },
            1000
          );


        } catch (error) {

          console.error(error);

          showMessage(
            "Unable to connect to the server.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "SIGN UP";

        }

      }
    );


  function googleLogin() {

    window.location.href =
      "/auth/google";

  }


  function githubLogin() {

    window.location.href =
      "/auth/github";

  }

</script>

</body>
      </html>
