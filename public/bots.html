<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Bots - ADEZ TECH PRO</title>

  <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">

      <div class="brand-logo">A</div>

      <div>
        <h2>ADEZ TECH</h2>
        <span>PRO PANEL</span>
      </div>

    </div>


    <nav>

      <a href="/dashboard.html" class="nav-link">
        <span>▣</span> Dashboard
      </a>

      <a href="/deploy.html" class="nav-link">
        <span>🤖</span> Deploy Bot
      </a>

      <a href="/bots.html" class="nav-link active">
        <span>📱</span> My Bots
      </a>

      <a href="/boosting.html" class="nav-link">
        <span>🚀</span> Social Media Boosting
      </a>

      <a href="/wallet.html" class="nav-link">
        <span>💰</span> Wallet
      </a>

      <a href="/orders.html" class="nav-link">
        <span>📦</span> Orders
      </a>

      <a href="/referrals.html" class="nav-link">
        <span>👥</span> Earn Money
      </a>

      <a href="/documentation.html" class="nav-link">
        <span>📚</span> API Documentation
      </a>

      <a href="/payment.html" class="nav-link">
        <span>💳</span> Payment
      </a>

      <a href="/settings.html" class="nav-link">
        <span>⚙️</span> Settings
      </a>

    </nav>


    <button
      class="logout"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <button
        class="menu-button"
        onclick="toggleSidebar()"
      >
        ☰
      </button>

      <div>

        <h1>My Bots</h1>

        <p>
          Manage your WhatsApp bots
        </p>

      </div>

    </header>


    <section class="content">


      <div class="page-header">

        <div>

          <h2>Your Bots</h2>

          <p>
            View and manage your deployed bots.
          </p>

        </div>


        <a
          href="/deploy.html"
          class="primary-button"
        >
          + Deploy Bot
        </a>

      </div>


      <div id="botsContainer">

        <div class="loading">
          Loading bots...
        </div>

      </div>


    </section>

  </main>

</div>


<script>

function toggleSidebar() {

  document
    .querySelector(".sidebar")
    .classList.toggle("open");

}


async function logout() {

  await fetch("/api/logout", {
    method: "POST"
  });

  window.location.href =
    "/login.html";

}


async function loadBots() {

  const container =
    document.getElementById("botsContainer");


  try {

    const response =
      await fetch("/api/bots");


    if (response.status === 401) {

      window.location.href =
        "/login.html";

      return;

    }


    const bots =
      await response.json();


    if (!bots.length) {

      container.innerHTML = `

        <div class="empty-card">

          <div class="empty-icon">🤖</div>

          <h2>No bots yet</h2>

          <p>
            You haven't deployed a bot yet.
          </p>

          <a
            href="/deploy.html"
            class="primary-button"
          >
            Deploy Your First Bot
          </a>

        </div>

      `;

      return;

    }


    container.innerHTML = bots.map(bot => `

      <div class="bot-card">

        <div class="bot-main">

          <div class="bot-icon">
            🤖
          </div>

          <div>

            <h3>
              ${escapeHTML(bot.name)}
            </h3>

            <p>
              +${escapeHTML(bot.number)}
            </p>

          </div>

        </div>


        <div class="bot-status">

          <span class="status-badge ${bot.status}">
            ${bot.status}
          </span>

        </div>


        <div class="bot-date">

          Created:
          ${new Date(bot.createdAt)
            .toLocaleDateString()}

        </div>

      </div>

    `).join("");


  } catch (error) {

    console.error(error);

    container.innerHTML = `

      <div class="message error">
        Unable to load bots.
      </div>

    `;

  }

}


function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


loadBots();

</script>

</body>
</html>
