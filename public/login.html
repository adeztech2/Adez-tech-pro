<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <title>Login | ADEZ TECH</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top right, #073d58 0, transparent 35%),
        radial-gradient(circle at bottom left, #171044 0, transparent 35%),
        #070b16;
    }

    .auth-box {
      width: 100%;
      max-width: 460px;
      padding: 38px;
      background: #0d1424;
      border: 1px solid #1c2a43;
      border-radius: 18px;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo a {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .auth-logo span {
      color: #00d9ff;
    }

    .auth-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-heading h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    .auth-heading p {
      color: #8996ac;
      font-size: 14px;
    }

    .auth-form label {
      display: block;
      margin: 16px 0 7px;
      color: #d6deeb;
      font-size: 14px;
    }

    .auth-form input {
      width: 100%;
      padding: 14px;
      background: #070d19;
      color: #fff;
      border: 1px solid #263650;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    .auth-form input:focus {
      border-color: #00d9ff;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 60px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #00d9ff;
      cursor: pointer;
      padding: 6px;
    }

    .login-btn-main {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #00d9ff;
      color: #041018;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .login-btn-main:hover {
      background: #5eeaff;
    }

    .message {
      display: none;
      padding: 11px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #32171d;
      border: 1px solid #71313c;
      color: #ff8491;
    }

    .message.success {
      display: block;
      background: #102d27;
      border: 1px solid #205d50;
      color: #67e8c9;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 10px;
      color: #00d9ff;
      font-size: 13px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 23px;
      color: #8996ac;
      font-size: 14px;
    }

    .auth-footer a {
      color: #00d9ff;
      font-weight: bold;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #7f8ca3;
      font-size: 13px;
    }

    .back-home:hover {
      color: #00d9ff;
    }

    @media (max-width: 500px) {
      .auth-box {
        padding: 27px 21px;
      }
    }
  </style>
</head>

<body class="auth-page">

  <div class="auth-box">

    <div class="auth-logo">
      <a href="index.html">
        ADEZ<span>TECH</span>
      </a>
    </div>

    <div class="auth-heading">
      <h1>Welcome Back</h1>
      <p>Login to your ADEZ TECH account.</p>
    </div>

    <form id="loginForm" class="auth-form">

      <label for="loginEmail">
        Email Address
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required
      >


      <label for="loginPassword">
        Password
      </label>

      <div class="password-wrap">

        <input
          id="loginPassword"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword()">
          Show
        </button>

      </div>


      <a href="#" class="forgot" onclick="forgotPassword(event)">
        Forgot password?
      </a>


      <div id="loginMessage" class="message"></div>


      <button
        type="submit"
        class="login-btn-main">
        Login
      </button>

    </form>


    <div class="auth-footer">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>


    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

  </div>


<script>
  const loginForm =
    document.getElementById("loginForm");

  const loginMessage =
    document.getElementById("loginMessage");


  function showMessage(message, type) {

    loginMessage.textContent = message;

    loginMessage.className =
      "message " + type;
  }


  function togglePassword() {

    const password =
      document.getElementById("loginPassword");

    const button =
      document.querySelector(".show-password");


    if (password.type === "password") {

      password.type = "text";

      button.textContent = "Hide";

    } else {

      password.type = "password";

      button.textContent = "Show";

    }
  }


  loginForm.addEventListener("submit", function(e) {

    e.preventDefault();


    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    const savedUser =
      JSON.parse(
        localStorage.getItem("adezUser") || "null"
      );


    if (!savedUser) {

      showMessage(
        "No ADEZ TECH account was found. Please register first.",
        "error"
      );

      return;
    }


    if (
      email !==
      String(savedUser.email).toLowerCase()
    ) {

      showMessage(
        "Incorrect email or password.",
        "error"
      );

      return;
    }


    if (
      password !==
      savedUser.password
    ) {

      showMessage(
        "Incorrect email or password.",
        "error"
      );

      return;
    }


    showMessage(
      "Login successful. Opening dashboard...",
      "success"
    );


    setTimeout(function() {
      window.location.href =
        "dashboard.html";
    }, 700);

  });


  function forgotPassword(event) {

    event.preventDefault();

    const savedUser =
      JSON.parse(
        localStorage.getItem("adezUser") || "null"
      );


    if (!savedUser) {

      alert(
        "No account found. Please create an account first."
      );

      return;
    }


    alert(
      "Password recovery will be available when ADEZ TECH is connected to a secure authentication backend."
    );
  }
</script>

</body>
</html>
