<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ADEZ TECH PRO | Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #090d12;
      --card: #14263b;
      --dark: #0e1a2a;
      --blue: #2458ff;
      --text: #f1f4fa;
      --muted: #8e9caf;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* HEADER */

    .header {
      height: 102px;
      margin: 10px 8px 15px;
      border: 2px solid var(--blue);
      border-radius: 25px;
      background: #14253a;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      box-shadow: 0 0 18px rgba(36, 88, 255, .15);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .menu-btn {
      width: 40px;
      height: 40px;

      border: none;
      background: transparent;

      color: #dce4ee;
      font-size: 31px;
      line-height: 1;

      cursor: pointer;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .brand span {
      color: #9ca7b7;
    }

    .profile-logo {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      border: 2px solid var(--blue);

      background:
        radial-gradient(
          circle,
          #173b72 0%,
          #07101c 70%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #36dfff;
      font-size: 9px;
      font-weight: 800;

      text-align: center;
      line-height: 1.1;
    }

    /* MAIN */

    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 0 8px 30px;
    }

    /* WELCOME */

    .welcome {
      min-height: 137px;

      background: var(--card);

      border-radius: 22px;

      padding: 25px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 17px;
    }

    .welcome-left {
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .welcome-logo {
      width: 79px;
      height: 79px;

      border-radius: 16px;

      background: #02080e;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #1760ff;

      font-size: 20px;
      font-weight: 900;
    }

    .welcome-small {
      color: #8794a6;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 5px;
    }

    .welcome h1 {
      font-size: 25px;
      font-weight: 800;
    }

    .currency {
      color: #d9e0e9;

      font-size: 14px;

      display: flex;
      align-items: center;
      gap: 8px;

      white-space: nowrap;
    }

    .currency span {
      color: #8997a9;
      font-size: 19px;
    }

    /* QUICK ACTIONS */

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 16px;

      margin-bottom: 17px;
    }

    .quick-card {
      min-height: 102px;

      background: var(--card);

      border-radius: 22px;

      display: flex;
      align-items: center;

      padding: 18px;

      text-decoration: none;
      color: white;

      transition: .2s;
    }

    .quick-card:hover {
      transform: translateY(-2px);
    }

    .quick-icon {
      width: 57px;
      height: 57px;

      background: #153b87;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;

      margin-right: 18px;
    }

    .quick-title {
      font-size: 17px;
      font-weight: 700;
    }

    .quick-subtitle {
      color: #8997a8;

      font-size: 13px;

      margin-top: 7px;
    }

    /* BALANCE */

    .balance-card {
      position: relative;

      height: 405px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 75% 45%,
          rgba(29, 61, 128, .48),
          transparent 55%
        ),
        var(--card);

      border-radius: 23px;

      padding: 25px;

      margin-bottom: 18px;
    }

    .balance-title {
      color: #9ba7b7;

      font-size: 14px;
      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 20px;
    }

    .balance-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 10px;

      position: relative;
      z-index: 5;
    }

    .balance-btn {
      height: 49px;

      border-radius: 25px;

      border: 1px solid #29415d;

      background: rgba(17, 31, 48, .45);

      color: #e5e9ef;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    .balance-btn:hover {
      border-color: var(--blue);
      background: #142d54;
    }

    .balance-number {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;

      margin-top: 40px;
    }

    .balance-number .zero {
      font-size: 68px;
      font-weight: 300;
      line-height: 1;
    }

    .balance-details {
      margin-left: 7px;
      margin-top: 7px;
    }

    .balance-details strong {
