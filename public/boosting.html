<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADEZ TECH PRO | SMM Boost</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#090d12;
  --card:#14263b;
  --input:#0c1725;
  --blue:#2458ff;
  --text:#f3f6fa;
  --muted:#8e9caf;
  --border:#263b55;
  --green:#35d98a;
  --red:#ff5d68;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.header{
  height:102px;
  margin:10px 8px 15px;
  border:2px solid var(--blue);
  border-radius:25px;
  background:#14253a;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:20px;
}

.menu-btn{
  border:0;
  background:none;
  color:white;
  font-size:30px;
  cursor:pointer;
}

.brand{
  font-size:20px;
  font-weight:800;
}

.brand span{
  color:#9ca7b7;
}

.profile-logo{
  width:58px;
  height:58px;

  border-radius:50%;
  border:2px solid var(--blue);

  background:radial-gradient(
    circle,
    #173b72,
    #07101c 70%
  );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#36dfff;
  font-size:9px;
  font-weight:800;
  text-align:center;
}

.container{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:0 8px 40px;
}

.page-title{
  background:var(--card);
  border-radius:22px;
  padding:25px 22px;
  margin-bottom:17px;
}

.page-title small{
  color:#8997a8;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
}

.page-title h1{
  font-size:27px;
  margin-top:7px;
}

.page-title p{
  color:var(--muted);
  font-size:13px;
  margin-top:8px;
}

.balance{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:17px;
}

.balance-title{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  letter-spacing:1.5px;
}

.balance-value{
  margin-top:7px;
  font-size:27px;
  font-weight:800;
}

.form-card{
  background:var(--card);
  border-radius:22px;
  padding:23px;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  color:#cbd4df;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

select,
input{
  width:100%;
  height:53px;

  background:var(--input);
  color:white;

  border:1px solid var(--border);
  border-radius:13px;

  outline:none;
  padding:0 15px;
  font-size:14px;
}

select:focus,
input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(36,88,255,.12);
}

.service-info{
  background:#0d1b2d;
  border-radius:15px;
  padding:17px;
  margin-bottom:18px;
}

.service-info-row{
  display:flex;
  justify-content:space-between;
  gap:10px;

  padding:8px 0;

  border-bottom:1px solid #1c3048;

  font-size:13px;
}

.service-info-row:last-child{
  border-bottom:0;
}

.service-info-row span:first-child{
  color:var(--muted);
}

.service-info-row span:last-child{
  font-weight:700;
}

.price-box{
  background:#102b61;
  border:1px solid #214ca9;

  border-radius:17px;

  padding:20px;

  margin:20px 0;
}

.price-label{
  color:#9eabc0;
  font-size:12px;
  font-weight:700;
}

.price{
  font-size:34px;
  font-weight:800;
  margin-top:6px;
}

.price small{
  font-size:13px;
  color:#9ba8ba;
}

.order-btn{
  width:100%;
  height:55px;

  border:0;
  border-radius:14px;

  background:linear-gradient(
    135deg,
    #2458ff,
    #1642d4
  );

  color:white;

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.order-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:13px;
  border-radius:12px;
  margin-bottom:17px;
  font-size:13px;
}

.message.error{
  display:block;
  color:#ffb1b6;
  background:rgba(255,70,80,.1);
  border:1px solid rgba(255,70,80,.2);
}

.message.success{
  display:block;
  color:#9df2c5;
  background:rgba(53,217,138,.1);
  border:1px solid rgba(53,217,138,.2);
}

/* SIDE MENU */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:20;
}

.overlay.show{
  display:block;
}

.side-menu{
  position:fixed;
  top:0;
  left:-285px;

  width:275px;
  height:100vh;

  background:#101d2e;
  z-index:30;

  padding:25px;

  transition:.25s;

  box-shadow:8px 0 30px rgba(0,0,0,.4);
}

.side-menu.open{
  left:0;
}

.side-brand{
  font-size:21px;
  font-weight:800;
  margin-bottom:35px;
}

.side-menu a{
  display:block;

  color:#c4ceda;
  text-decoration:none;

  padding:15px;
  border-radius:10px;

  margin-bottom:5px;

  font-size:14px;
}

.side-menu a:hover,
.side-menu a.active{
  background:#18335a;
  color:white;
}

@media(max-width:500px){

  .container{
    padding-left:8px;
    padding-right:8px;
  }

  .form-card{
    padding:19px;
  }

  .page-title h1{
    font-size:24px;
  }

}
</style>
</head>

<body>

<!-- SIDE MENU -->

<div
  class="overlay"
  id="overlay"
  onclick="closeMenu()">
</div>

<aside
  class="side-menu"
  id="sideMenu">

  <div class="side-brand">
    ADEZ <span style="color:#8d98a8;">TECH PRO</span>
  </div>

  <a href="/dashboard.html">
    🏠 Dashboard
  </a>

  <a href="/deploy.html">
    ☁️ Deploy Bots
  </a>

  <a href="/boosting.html" class="active">
    📣 SMM Boost
  </a>

  <a href="/topup.html">
    💰 Top Up
  </a>

  <a href="/payment.html">
    💳 Payments
  </a>

  <a href="/api.html">
    🔑 API
  </a>

  <a href="/orders.html">
    📦 Orders
  </a>

  <a href="/referrals.html">
    👥 Referrals
  </a>

  <a href="/settings.html">
    ⚙️ Settings
  </a>

  <a href="/login.html">
    🚪 Logout
  </a>

</aside>


<!-- HEADER -->

<header class="header">

  <div class="header-left">

    <button
      class="menu-btn"
      onclick="openMenu()">
      ☰
    </button>

    <div class="brand">
      ADEZ <span>TECH PRO</span>
    </div>

  </div>

  <div class="profile-logo">
    ADEZ<br>TECH
  </div>

</header>


<main class="container">

  <!-- TITLE -->

  <section class="page-title">

    <small>SOCIAL MEDIA MARKETING</small>

    <h1>
      📣 SMM Boost
    </h1>

    <p>
      Boost your social media with our available services.
    </p>

  </section>


  <!-- BALANCE -->

  <section class="balance">

    <div class="balance-title">
      AVAILABLE BALANCE
    </div>

    <div class="balance-value">
      <span id="balance">0.00</span> KSH
    </div>

  </section>


  <!-- ORDER FORM -->

  <section class="form-card">

    <div
      id="message"
      class="message">
    </div>


    <form id="boostForm">


      <!-- SERVICE -->

      <div class="form-group">

        <label for="service">
          Select Service
        </label>

        <select
          id="service"
          required>

          <option value="">
            Select a service
          </option>

          <option
            value="facebook_followers"
            data-name="Facebook Followers"
            data-price="50">

            Facebook Followers — 50 KSH / 1K

          </option>

          <option
            value="facebook_likes"
            data-name="Facebook Likes"
            data-price="40">

            Facebook Likes — 40 KSH / 1K

          </option>

          <option
            value="instagram_followers"
            data-name="Instagram Followers"
            data-price="60">

            Instagram Followers
